name: Wind Turbine MLOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1: Run the full pytest test suite
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull data with DVC
        run: |
          pip install dvc
          dvc pull --no-run-cache || echo "DVC remote not configured — using committed data"

      - name: Run pytest test suite
        run: pytest tests/ -v --tb=short

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2: Train model — runs only if tests pass
  # ──────────────────────────────────────────────────────────────────────────
  train:
    name: Train Model
    runs-on: ubuntu-latest
    needs: test   # Depends on test job passing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull data with DVC
        run: |
          pip install dvc
          dvc pull --no-run-cache || echo "DVC remote not configured — using committed data"

      - name: Train model and verify performance threshold
        run: |
          python src/train.py --config configs/train_config.yaml
        # train.py exits with code 1 if R² < minimum threshold,
        # which will fail this step and the overall pipeline.

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs
          path: mlruns/
          retention-days: 30

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          retention-days: 30
